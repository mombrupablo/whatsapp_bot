# version: '3.8'
x-airflow-common: &airflow-common
  image: apache/airflow:2.7.2 # Versión estable de Airflow
  environment:
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${DBUSER}:${DBPASSWORD}@postgres:5432/${AIRFLOW_DBUSER}
    - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW_FERNET_KEY}
    - AIRFLOW__CORE__LOAD_EXAMPLES=False
    - AIRFLOW__WEBSERVER__SECRET_KEY=${AIRFLOW_SECRET_KEY}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:13
    environment:
      - POSTGRES_USER=${DBUSER}
      - POSTGRES_PASSWORD=${DBPASSWORD}
      - POSTGRES_DB=${AIRFLOW_DBNAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d # To create the DB from here.
    ports:
      - "${DBPORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-webserver:
    <<: *airflow-common
    command: bash -c "airflow db migrate && airflow webserver" # <--- Reemplaza aquí
    ports:
      - "${AIRFLOW_PORT}:8080" # El puerto que elegiste antes
    restart: always

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always

  airflow-init:
    <<: *airflow-common
    command: version
    environment:
      - _AIRFLOW_DB_UPGRADE=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=admin

  waha:
    image: devlikeapro/waha:latest
    ports:
      - "${WAHA_PORT}:3000"
    restart: always
    environment:
      - WAHA_PRINT_QR=true
      - WAHA_ENGINE=WEBJS      
      - WAHA_DASHBOARD_USERNAME=${WAHA_DASHBOARD_USERNAME}
      - WAHA_DASHBOARD_PASSWORD=${WAHA_DASHBOARD_PASSWORD}
      - WAHA_API_KEY=${WAHA_API_KEY}
      - WAHA_DASHBOARD_API_KEY=${WAHA_DASHBOARD_API_KEY}
      - WAHA_DASHBOARD_URL=http://${WAHA_HOST}:${WAHA_PORT}

volumes:
  postgres_data:
